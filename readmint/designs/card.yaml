$schema: "https://raw.githubusercontent.com/MrLarkyy/Readmint/main/packages/format/schema/design-v0.schema.json"
version: 0
title: "Youssful"
description: "Profile summary: overview, metrics, languages, and contribution calendar."

canvas:
  width: 840
  height: 420

assets:
  fonts:
    body:
      family: "Montserrat"
      src: "fonts/Montserrat-Medium.ttf"
      weight: 500
      licence:
        embedding: "allowed"
        name: "OFL-1.1"
    bold:
      family: "Montserrat"
      src: "fonts/Montserrat-ExtraBold.ttf"
      weight: 800
      licence:
        embedding: "allowed"
        name: "OFL-1.1"
  images:
    avatar:
      src: "{{ github.avatarUrl }}"

palette:
  light:
    bg: "#ffffff"
    panel: "#f6f8fa"
    border: "#d0d7de"
    border-subtle: "#e1e4e8"
    ink: "#1f2328"
    muted: "#656d76"
    accent: "#0969da"
    bar-bg: "#eaeef2"
    cal0: "#ebedf0"
    cal1: "#9be9a8"
    cal2: "#40c463"
    cal3: "#30a14e"
    cal4: "#216e39"
  dark:
    bg: "#0d1117"
    panel: "#161b22"
    border: "#30363d"
    border-subtle: "#21262d"
    ink: "#e6edf3"
    muted: "#8b949e"
    accent: "#2f81f7"
    bar-bg: "#21262d"
    cal0: "#161b22"
    cal1: "#0e4429"
    cal2: "#006d32"
    cal3: "#26a641"
    cal4: "#39d353"

components:

  # ─── Metric row ────────────────────────────────────
  stat-row:
    description: "Key-value metric row."
    props:
      label: { type: "string", default: "" }
      value: { type: "string", default: "" }
      rowWidth: { type: "number", default: 210 }
    layers:
      - type: text
        content: "{{ props.label }}"
        font: body
        fontSize: 12
        fill: "{{ palette.muted }}"
      - type: text
        content: "{{ props.value }}"
        font: bold
        fontSize: 12
        fill: "{{ palette.ink }}"
        width: "{{ props.rowWidth }}"
        align: end

  # ─── Language bar ──────────────────────────────────
  lang-bar:
    description: "Language share row with a solid bar."
    props:
      name: { type: "string", default: "" }
      color: { type: "color", default: "#8b949e" }
      share: { type: "number", default: 0 }
      barWidth: { type: "number", default: 210 }
    layers:
      - type: text
        content: "{{ props.name }}"
        font: body
        fontSize: 11
        fill: "{{ palette.ink }}"
      - type: text
        content: "{{ props.share | percent(0) }}"
        font: body
        fontSize: 11
        fill: "{{ palette.muted }}"
        width: "{{ props.barWidth }}"
        align: end
      - type: rect
        y: 16
        width: "{{ props.barWidth }}"
        height: 4
        radius: 2
        fill: "{{ palette.bar-bg }}"
      - type: rect
        y: 16
        width: "{{ props.share * props.barWidth | clamp(2, props.barWidth) }}"
        height: 4
        radius: 2
        fill: "{{ props.color }}"

  # ─── Calendar cell ─────────────────────────────────
  cell:
    description: "Single calendar day square."
    props:
      level: { type: "number", default: 0 }
      count: { type: "number", default: 0 }
      date: { type: "string", default: "" }
      index: { type: "number", default: 0 }
      week: { type: "number", default: 0 }
      weekday: { type: "number", default: 0 }
      size: { type: "number", default: 9 }
      radius: { type: "number", default: 2 }
      height: { type: "number", default: 0 }
      color: { type: "color", default: "#ebedf0" }
    layers:
      - type: rect
        width: "{{ props.size }}"
        height: "{{ props.size }}"
        radius: "{{ props.radius }}"
        fill: "{{ props.color }}"

  # ─── Calendar grid ─────────────────────────────────
  calendar:
    description: "52-week activity heatmap."
    props:
      cellSize: { type: "number", default: 9 }
      gap: { type: "number", default: 2 }
      radius: { type: "number", default: 2 }
      weeks: { type: "number", default: 52 }
      theme:
        type: enum
        values: ["light", "dark"]
        default: "light"
    layers:
      - type: component
        ref: cell
        repeat:
          each: "{{ github.contributions.days }}"
          as: day
          index: i
        if: "{{ (day.week - (github.contributions.weeks - props.weeks | max(0))) >= 0 }}"
        x: "{{ (day.week - (github.contributions.weeks - props.weeks | max(0))) * (props.cellSize + props.gap) }}"
        y: "{{ day.weekday * (props.cellSize + props.gap) }}"
        props:
          level: "{{ day.level }}"
          count: "{{ day.count }}"
          date: "{{ day.date }}"
          index: "{{ i }}"
          week: "{{ (day.week - (github.contributions.weeks - props.weeks | max(0))) }}"
          weekday: "{{ day.weekday }}"
          size: "{{ props.cellSize }}"
          radius: "{{ props.radius }}"
          height: 0
          color: "{{ [palette.cal0, palette.cal1, palette.cal2, palette.cal3, palette.cal4][day.level] | default(palette.cal0) }}"

  # ─── The Main Card ─────────────────────────────────
  card:
    description: "Main profile card."
    props:
      theme:
        type: enum
        values: ["light", "dark"]
        default: "light"
    layers:

      # Outer container
      - type: rect
        x: 0.5
        y: 0.5
        width: 839
        height: 419
        radius: 8
        fill: "{{ palette.bg }}"
        stroke: "{{ palette.border }}"
        strokeWidth: 1

      # Profile Picture (inlined via data binding)
      - type: image
        asset: avatar
        x: 28
        y: 24
        width: 52
        height: 52
        fit: cover

      - type: rect
        x: 27.5
        y: 23.5
        width: 53
        height: 53
        radius: 6
        stroke: "{{ palette.border }}"
        strokeWidth: 1
        fill: "none"

      # Name & Login
      - type: text
        content: "{{ github.name || github.login }}"
        font: bold
        fontSize: 18
        fill: "{{ palette.ink }}"
        x: 94
        y: 28
        width: 450

      - type: text
        content: "@{{ github.login }}"
        font: body
        fontSize: 12
        fill: "{{ palette.muted }}"
        x: 94
        y: 52

      # Bio / Tagline
      - type: text
        content: "{{ github.bio | default('AI engineer and systems developer building in Java, TypeScript, Python and Rust.') | truncate(95) }}"
        font: body
        fontSize: 12
        fill: "{{ palette.muted }}"
        x: 28
        y: 92
        width: 540

      # ─── Left Section: Metrics ─────────────────────
      - type: text
        content: "Activity Metrics"
        font: bold
        fontSize: 12
        letterSpacing: 0.5
        fill: "{{ palette.ink }}"
        x: 28
        y: 124

      - type: group
        x: 28
        y: 148
        layout:
          type: stack
          direction: column
          gap: 8
        children:
          - type: component
            ref: stat-row
            props:
              label: "Commits (year)"
              value: "{{ github.contributions.commits | compact }}"
              rowWidth: 210
          - type: component
            ref: stat-row
            props:
              label: "Pull requests"
              value: "{{ github.contributions.pullRequests | compact }}"
              rowWidth: 210
          - type: component
            ref: stat-row
            props:
              label: "Issues resolved"
              value: "{{ github.contributions.issues | compact }}"
              rowWidth: 210
          - type: component
            ref: stat-row
            props:
              label: "Code reviews"
              value: "{{ github.contributions.reviews | compact }}"
              rowWidth: 210
          - type: component
            ref: stat-row
            props:
              label: "Public repositories"
              value: "{{ github.counts.repositories | compact }}"
              rowWidth: 210

      # ─── Left Section: Languages ───────────────────
      - type: text
        content: "Primary Languages"
        font: bold
        fontSize: 12
        letterSpacing: 0.5
        fill: "{{ palette.ink }}"
        x: 28
        y: 274

      - type: group
        x: 28
        y: 298
        layout:
          type: stack
          direction: column
          gap: 9
        children:
          - type: component
            ref: lang-bar
            props:
              name: "Java"
              color: "#b07219"
              share: 0.40
              barWidth: 210
          - type: component
            ref: lang-bar
            props:
              name: "TypeScript"
              color: "#3178c6"
              share: 0.35
              barWidth: 210
          - type: component
            ref: lang-bar
            props:
              name: "Python"
              color: "#3572a5"
              share: 0.15
              barWidth: 210
          - type: component
            ref: lang-bar
            props:
              name: "Rust"
              color: "#dea584"
              share: 0.10
              barWidth: 210

      # Vertical divider line
      - type: rect
        x: 275
        y: 124
        width: 1
        height: 268
        fill: "{{ palette.border-subtle }}"

      # ─── Right Section: Contributions Heatmap ──────
      - type: text
        content: "Contribution Calendar"
        font: bold
        fontSize: 12
        letterSpacing: 0.5
        fill: "{{ palette.ink }}"
        x: 296
        y: 124

      - type: text
        content: "{{ github.contributions.total | number }} contributions in the last year"
        font: body
        fontSize: 11
        fill: "{{ palette.muted }}"
        x: 480
        y: 124
        width: 332
        align: end

      - type: component
        ref: calendar
        x: 296
        y: 148
        props:
          cellSize: 8
          gap: 2
          radius: 1
          weeks: 52
          theme: "{{ props.theme }}"

      # ─── Right Section: Streaks & Summary ──────────
      - type: group
        x: 296
        y: 240
        layout:
          type: stack
          direction: row
          gap: 12
        children:

          # Current Streak
          - type: group
            width: 252
            children:
              - type: rect
                x: 0.5
                y: 0.5
                width: 251
                height: 68
                radius: 6
                stroke: "{{ palette.border }}"
                strokeWidth: 1
                fill: "{{ palette.panel }}"
              - type: text
                content: "Current streak"
                font: body
                fontSize: 11
                fill: "{{ palette.muted }}"
                x: 14
                y: 12
              - type: text
                content: "{{ github.contributions.streaks.current.length | number }} days"
                font: bold
                fontSize: 18
                fill: "{{ palette.ink }}"
                x: 14
                y: 30
                if: "{{ github.contributions.streaks.current.length > 0 }}"
              - type: text
                content: "{{ github.contributions.streaks.current.start | date('MMM d') }} – {{ github.contributions.streaks.current.end | date('MMM d') }}"
                font: body
                fontSize: 10
                fill: "{{ palette.muted }}"
                x: 14
                y: 51
                if: "{{ github.contributions.streaks.current.length > 0 }}"
              - type: text
                content: "0 days"
                font: bold
                fontSize: 16
                fill: "{{ palette.muted }}"
                x: 14
                y: 34
                if: "{{ github.contributions.streaks.current.length == 0 }}"

          # Longest Streak
          - type: group
            width: 252
            children:
              - type: rect
                x: 0.5
                y: 0.5
                width: 251
                height: 68
                radius: 6
                stroke: "{{ palette.border }}"
                strokeWidth: 1
                fill: "{{ palette.panel }}"
              - type: text
                content: "Longest streak"
                font: body
                fontSize: 11
                fill: "{{ palette.muted }}"
                x: 14
                y: 12
              - type: text
                content: "{{ github.contributions.streaks.longest.length | number }} days"
                font: bold
                fontSize: 18
                fill: "{{ palette.ink }}"
                x: 14
                y: 30
                if: "{{ github.contributions.streaks.longest.length > 0 }}"
              - type: text
                content: "{{ github.contributions.streaks.longest.start | date('MMM d') }} – {{ github.contributions.streaks.longest.end | date('MMM d') }}"
                font: body
                fontSize: 10
                fill: "{{ palette.muted }}"
                x: 14
                y: 51
                if: "{{ github.contributions.streaks.longest.length > 0 }}"
              - type: text
                content: "0 days"
                font: bold
                fontSize: 16
                fill: "{{ palette.muted }}"
                x: 14
                y: 34
                if: "{{ github.contributions.streaks.longest.length == 0 }}"

      # Total Contributions Banner
      - type: group
        x: 296
        y: 320
        children:
          - type: rect
            x: 0.5
            y: 0.5
            width: 516
            height: 66
            radius: 6
            stroke: "{{ palette.border }}"
            strokeWidth: 1
            fill: "{{ palette.panel }}"
          - type: text
            content: "Annual Contributions"
            font: body
            fontSize: 11
            fill: "{{ palette.muted }}"
            x: 16
            y: 14
          - type: text
            content: "{{ github.contributions.total | number }}"
            font: bold
            fontSize: 24
            fill: "{{ palette.ink }}"
            x: 16
            y: 32
          - type: text
            content: "Tracked across all public commits, PRs, and reviews"
            font: body
            fontSize: 10
            fill: "{{ palette.muted }}"
            x: 180
            y: 38
            width: 320
            align: end

layers:
  - type: component
    ref: card
    props:
      theme: "light"

name: Readmint

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: readmint
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: MrLarkyy/Readmint@v0.5.1
        with:
          designs: |
            readmint/designs/card.yaml
            readmint/designs/card-dark.yaml
